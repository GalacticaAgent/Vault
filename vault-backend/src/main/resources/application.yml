spring:
  application:
    name: vault-backend
  
  profiles:
    active: dev
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jReactiveRepositoriesAutoConfiguration
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vault?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  elasticsearch:
    uris: http://localhost:9200
    username: 
    password: 
    connection-timeout: 5s
    socket-timeout: 60s

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.vault.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务器配置
server:
  port: 8082
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT 配置
jwt:
  secret: vault-secret-key-change-in-production
  expiration: 86400000 # 24小时（毫秒）

# Milvus 配置
milvus:
  host: localhost
  port: 19530

# Vault 应用配置
vault:
  # AI服务配置 - DeepSeek API
  ai:
    # DeepSeek API密钥
    api-key: sk-63c92674eebe469b8950cc829ede6fd6
    # DeepSeek API端点
    api-url: https://api.deepseek.com/chat/completions
    # DeepSeek模型
    default-model: deepseek-chat
    max-tokens: 4096
    temperature: 0.7
    timeout: 60000
  
  # Skill系统配置
  skill:
    directory: demo_skills  # Skills目录路径（相对于项目根目录）
    router:
      use-llm: true  # 是否使用LLM进行智能路由
      max-skills: 3  # 最多选择的技能数量
      max-retries: 2  # LLM路由最大重试次数
    executor:
      timeout: 30  # Skill执行超时时间（秒）
      retry-enabled: true  # 是否启用重试
      max-retries: 2  # 步骤执行重试次数
  
  # 文件上传配置
  file:
    upload-dir: uploads  # 文件上传目录
    max-size: 10485760  # 最大文件大小（10MB）
    allowed-types: pdf,java,py,js,ts,md,txt  # 允许的文件类型

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
  max-tokens: 4000
  temperature: 0.7
  timeout: 60000

# 应用配置
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: true
  
# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

